<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Idiomas · EN · FR · ES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f4ef;--surface:#fff;--s2:#f2ede6;
  --ink:#1a1814;--muted:#7a7268;--bd:#e2dbd0;
  --en:#1a4a2e;--en-bg:#eaf4ee;--en-bd:#a8d4b4;
  --fr:#1a2e4a;--fr-bg:#eaeef4;--fr-bd:#a8b8d4;
  --es:#4a1a1a;--es-bg:#f4eaea;--es-bd:#d4a8a8;
  --gold:#b8852a;--gold-bg:#fdf3e0;
  --green:#2d6a2d;--green-bg:#eaf4ea;--green-bd:#a8d4a8;
  --amber:#8a5a00;--amber-bg:#fdf3e0;--amber-bd:#f0c060;
}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
nav{background:var(--ink);color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:200}
.nav-brand{font-size:15px;font-weight:600}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-date{font-size:12px;opacity:.6}
.sdot{width:8px;height:8px;border-radius:50%;background:#4a4;transition:background .3s}
.sdot.saving{background:#fa0}.sdot.err{background:#f44}
.lang-tabs{display:flex;border-bottom:1px solid var(--bd);background:var(--surface);position:sticky;top:52px;z-index:190;overflow-x:auto}
.ltab{padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;border:none;border-bottom:3px solid transparent;color:var(--muted);background:none;white-space:nowrap;transition:all .15s}
.ltab.active[data-l=en]{color:var(--en);border-bottom-color:var(--en)}
.ltab.active[data-l=fr]{color:var(--fr);border-bottom-color:var(--fr)}
.ltab.active[data-l=es]{color:var(--es);border-bottom-color:var(--es)}
.ltab.active[data-l=all]{color:var(--ink);border-bottom-color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ovc{border-radius:10px;padding:12px 14px;border:1px solid var(--bd)}
.ovc[data-l=en]{background:var(--en-bg);border-color:var(--en-bd)}
.ovc[data-l=fr]{background:var(--fr-bg);border-color:var(--fr-bd)}
.ovc[data-l=es]{background:var(--es-bg);border-color:var(--es-bd)}
.ov-lang{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-bottom:3px}
.ov-pct{font-size:22px;font-weight:700}
.ov-track{height:5px;border-radius:3px;background:rgba(0,0,0,.1);margin:5px 0 3px;overflow:hidden}
.ov-fill{height:100%;border-radius:3px;transition:width .5s}
.ovc[data-l=en] .ov-fill{background:var(--en)}
.ovc[data-l=fr] .ov-fill{background:var(--fr)}
.ovc[data-l=es] .ov-fill{background:var(--es)}
.ov-sub{font-size:11px;opacity:.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--bd);border-radius:8px;padding:10px 8px;text-align:center}
.stat-n{font-size:20px;font-weight:700}
.stat-l{font-size:10px;color:var(--muted);margin-top:2px}
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.wbtn:hover:not(:disabled){background:var(--s2)}.wbtn:disabled{opacity:.3;cursor:not-allowed}
.w-info{flex:1}.w-title{font-size:14px;font-weight:600}.w-range{font-size:11px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.dbtn{border:1px solid var(--bd);border-radius:8px;padding:7px 4px;text-align:center;cursor:pointer;background:var(--surface);transition:all .15s}
.dbtn:hover{border-color:#aaa}.dbtn.sel{border:2px solid var(--ink)}.dbtn.future{opacity:.45}
.dbtn.fall{background:var(--green-bg);border-color:var(--green-bd)}
.dbtn.fen{background:var(--en-bg);border-color:var(--en-bd)}
.dbtn.ffr{background:var(--fr-bg);border-color:var(--fr-bd)}
.dbtn.fes{background:var(--es-bg);border-color:var(--es-bd)}
.dbtn.part{background:var(--amber-bg);border-color:var(--amber-bd)}
.d-name{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.d-num{font-size:13px;font-weight:600}
.d-dots{display:flex;justify-content:center;gap:2px;margin-top:3px}
.d-dot{width:5px;height:5px;border-radius:50%}
.day-hdr{background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.day-title{font-size:16px;font-weight:700}.day-meta{font-size:12px;color:var(--muted)}
.done-banner{background:var(--green-bg);border:1px solid var(--green-bd);border-radius:8px;padding:10px 14px;text-align:center;font-size:13px;font-weight:600;color:var(--green);margin-bottom:10px;display:none}
.sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sbadge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.sb-en{background:var(--en-bg);color:var(--en)}.sb-fr{background:var(--fr-bg);color:var(--fr)}.sb-es{background:var(--es-bg);color:var(--es)}
.tasks{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.task{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.task:hover:not(.fut){border-color:#bbb}.task.done{background:var(--green-bg);border-color:var(--green-bd)}.task.fut{opacity:.5;cursor:default}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:13px;color:transparent;transition:all .15s}
.task.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.tb{flex:1;min-width:0}
.t-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.t-label{font-size:13px;font-weight:600}
.t-time{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.t-detail{font-size:12px;color:var(--muted);line-height:1.5}
.t-specific{font-size:12px;margin-top:5px;padding:6px 9px;background:var(--s2);border-radius:6px;border-left:2px solid var(--bd);color:var(--ink);line-height:1.5}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.t-anki{background:#ede8ff;color:#3d2e8a}.t-gram{background:#e0ecff;color:#1a3a7a}
.t-in{background:#fff3e0;color:#7a4a00}.t-out{background:#ffe8e0;color:#7a2a00}
.t-voc{background:#e8f4e8;color:#1a4a1a}.t-fr{background:#eaeef8;color:#1a2e5a}.t-es{background:#f8eaea;color:#5a1a1a}
.lsession{background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:6px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.lsession:hover:not(.fut){border-color:#bbb}.lsession.done{background:var(--green-bg);border-color:var(--green-bd)}.lsession.fut{opacity:.5;cursor:default}
.ls-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ls-title{font-size:13px;font-weight:600}.ls-gram{font-size:11px;color:var(--muted);flex:1}
.ls-blocks{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.ls-block{font-size:12px;padding:6px 10px;background:var(--s2);border-radius:6px;border-left:2px solid var(--bd);line-height:1.5;color:var(--ink)}
.ls-block strong{font-weight:600;margin-right:4px}
.ls-foot{display:flex;align-items:center;gap:8px;font-size:12px;border-top:1px solid var(--bd);padding-top:8px}
.ls-foot .chk{width:20px;height:20px;flex-shrink:0}
.lsession.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.revc{background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.rev-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rev-title{font-size:13px;font-weight:700}
.rev-cnt{font-size:11px;background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:2px 9px;font-weight:600}
.rev-items{display:flex;flex-direction:column;gap:5px}
.ritem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--s2);border:1px solid var(--bd);font-size:12px;cursor:pointer;transition:all .15s;user-select:none}
.ritem:hover{border-color:#aaa}.ritem.dr{background:var(--green-bg);border-color:var(--green-bd)}
.rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.rdp{background:#e09020}.rdd{background:#2d6a2d}
.rt{flex:1}.rn{font-weight:500;margin-bottom:1px}.rw{font-size:11px;color:var(--muted)}
.rbtn{font-size:11px;padding:3px 9px;border-radius:7px;border:1px solid var(--bd);background:var(--surface);cursor:pointer;color:var(--muted)}
.ms-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.msi{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--surface);cursor:pointer;transition:all .15s;user-select:none}
.msi.done{background:var(--green-bg);border-color:var(--green-bd)}.msi.cur{border-color:var(--gold);background:var(--gold-bg)}.msi.lk{opacity:.45;cursor:default}
.ms-ico{font-size:18px;flex-shrink:0;width:26px;text-align:center;margin-top:1px}
.ms-body{flex:1}.ms-name{font-size:13px;font-weight:600;margin-bottom:2px}.ms-desc{font-size:11px;color:var(--muted);line-height:1.4}.ms-date{font-size:10px;color:var(--muted);margin-top:3px}
.ms-badge{font-size:10px;padding:3px 9px;border-radius:10px;white-space:nowrap;font-weight:600;align-self:flex-start;margin-top:2px}
.mb-d{background:var(--green-bg);color:var(--green)}.mb-c{background:var(--gold-bg);color:var(--gold)}.mb-l{background:var(--s2);color:var(--muted)}
footer{text-align:center;padding:32px 16px;font-size:11px;color:var(--muted)}
footer a{color:var(--muted);cursor:pointer}
@media(max-width:500px){.overview{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.dgrid{gap:4px}}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">Idiomas &nbsp;·&nbsp; EN · FR · ES</div>
  <div class="nav-right">
    <div class="nav-date" id="nav-date"></div>
    <div class="sdot" id="sdot"></div>
  </div>
</nav>

<div class="lang-tabs" id="lang-tabs">
  <button class="ltab active" data-l="en">🇺🇸 English</button>
  <button class="ltab" data-l="fr">🇫🇷 Français</button>
  <button class="ltab" data-l="es">🇪🇸 Español</button>
  <button class="ltab" data-l="all">📅 Visão Geral</button>
</div>

<div class="wrap">
  <div class="overview" id="overview"></div>
  <div class="stats" id="stats"></div>

  <div class="week-nav">
    <button class="wbtn" id="pw">←</button>
    <div class="w-info">
      <div class="w-title" id="wt">Semana 1</div>

    </div>
    <button class="wbtn" id="nw">→</button>
  </div>

  <div class="dgrid" id="dgrid"></div>

  <div class="day-hdr">
    <div>
      <div class="day-title" id="dtitle">Hoje</div>
      <div class="day-meta" id="dmeta"></div>
    </div>
    <div id="dphase"></div>
  </div>
  <div class="done-banner" id="done-banner">🎉 Todos os idiomas concluídos hoje!</div>

  <div id="content"></div>

  <div class="sec">🔁 Revisões espaçadas da semana</div>
  <div class="revc">

  <footer>
    Progresso salvo localmente · <a id="reset-btn">Apagar progresso</a><br>
    26/mai → 31/dez/2026 · 220 dias · 2h/dia
  </footer>
</div>

const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const dkey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const today=()=>new Date();
const totalW=()=>Math.ceil(TOTAL/7);
const wStart=w=>{const d=new Date(START);d.setDate(d.getDate()+w*7);return d};
const wEnd=w=>addD(wStart(w),6);
const wOf=d=>Math.max(0,Math.floor((d-START)/86400000/7));
const wNum=i=>Math.floor(i/7)+1;
const fmt=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
const isFut=d=>{const t=today();t.setHours(0,0,0,0);const dd=new Date(d);dd.setHours(0,0,0,0);return dd>t};
const getBlk=(arr,week)=>arr.find(g=>g.w.includes(week))||arr[arr.length-1];
const getVoc=(arr,week)=>arr[Math.min(Math.floor((week-1)/2.5)|0,arr.length-1)];

function getEN(idx){
  const week=wNum(idx), dow=addD(START,idx).getDay();
  const gram=getBlk(EN_GRAM,week);
  const phase=week<=6?0:week<=14?1:week<=22?2:3;
  const vocIdx=Math.min(Math.floor((week-1)%10),EN_VOCAB.length-1);
  const phaseIdx=Math.min(Math.floor(idx/55),EN_INPUT[0].length-1);
  return {
    phase:phase+1,
    gramTopic:gram.top,
    gramTask:gram.byDow[dow],
    inputType:[0,2,4].includes(dow)?'Leitura':'Listening',
    inputTask:(([0,2,4].includes(dow)?EN_INPUT[dow]:EN_INPUT[dow])||EN_INPUT[0])[Math.min(phaseIdx,9)],
    outputType:[0,3,6].includes(dow)?'Speaking':'Writing',
    outputTask:(EN_OUTPUT[dow]||EN_OUTPUT[0])[Math.min(phaseIdx,9)],
    vocabTheme:EN_VOCAB[Math.min(idx/7|0,EN_VOCAB.length-1)],
  };
}

function getFR(idx){
  const week=wNum(idx), dow=addD(START,idx).getDay();
  const gram=getBlk(FR_GRAM,week);
  return {gram:gram.top, task:gram.byDow[dow], vocab:getVoc(FR_VOC,week)};
}

function getES(idx){
  const week=wNum(idx), dow=addD(START,idx).getDay();
  const gram=getBlk(ES_GRAM,week);
  return {gram:gram.top, task:gram.byDow[dow], vocab:getVoc(ES_VOC,week)};
}

function setSave(s){const d=document.getElementById('sdot');d.className='sdot'+(s==='ok'?' ':s==='saving'?' saving':' err')}

async function save(){
  setSave('saving');
  const j=JSON.stringify(S);
  localStorage.setItem(SKEY,j);
  try{if(window.storage)await window.storage.set(SKEY,j)}catch(e){}
  setSave('ok');
}
async function load(){
  try{if(window.storage){const r=await window.storage.get(SKEY);if(r&&r.value){S=JSON.parse(r.value);return}}}catch(e){}
  const ls=localStorage.getItem(SKEY);
  if(ls)try{S=JSON.parse(ls);return}catch(e){}
  S={tasks:{},reviews:{},milestones:{}};
}

// ═══════════════════════════════
// COMPUTED
// ═══════════════════════════════
const EN_IDS=['anki','input','gram','output','vocab'];
function isDone(d,l){
  const k=dkey(d);if(!S.tasks[k])return false;
  if(l==='en')return EN_IDS.every(id=>S.tasks[k]['en_'+id]);
  return !!S.tasks[k][l+'_s'];
}
function isPartial(d){const k=dkey(d);return S.tasks[k]&&Object.values(S.tasks[k]).some(Boolean)}
function isAllDone(d){return isDone(d,'en')&&isDone(d,'fr')&&isDone(d,'es')}
function countDone(l){let c=0;for(let k in S.tasks){const dd=parseKey(k);if(isDone(dd,l))c++;}return c}
function parseKey(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function streak(){
  let s=0,d=new Date(today());
  while(d>=START){if(!isAllDone(d)){if(dkey(d)===dkey(today())&&isPartial(d)){d.setDate(d.getDate()-1);continue}break}s++;d.setDate(d.getDate()-1)}
  return s;
}
function pct(l){return Math.min(100,Math.round(countDone(l)/TOTAL*100))}
function countRevs(){let c=0;for(let k in S.reviews)if(S.reviews[k])c++;return c}

function renderGrid(){
  const g=document.getElementById('dgrid');g.innerHTML='';
  const ws=wStart(curW);
  for(let i=0;i<7;i++){
    const d=addD(ws,i);
    if(d<START||d>new Date(2026,11,31))continue;
    const fe=isDone(d,'en'),ff=isDone(d,'fr'),fs=isDone(d,'es');
    const all=fe&&ff&&fs,part=isPartial(d)&&!all;
    const fut=isFut(d),sel=dkey(d)===dkey(selDay);
    let cls='dbtn';
    if(all)cls+=' fall';
    else if(fe&&lang==='en')cls+=' fen';
    else if(ff&&lang==='fr')cls+=' ffr';
    else if(fs&&lang==='es')cls+=' fes';
    else if(part)cls+=' part';
    if(fut)cls+=' future';if(sel)cls+=' sel';
    const dots=['en','fr','es'].map(l=>{
      const c=isDone(d,l)?(l==='en'?'var(--en)':l==='fr'?'var(--fr)':'var(--es)'):'#e0d8d0';
      return `<div class="d-dot" style="background:${c}"></div>`;

    const btn=document.createElement('div');
    btn.className=cls;

    html+=`<div class="sec"><span>🇪🇸</span> Español <span class="sbadge sb-es">30 min</span></div>
    <div class="lsession${esDone?' done':''}${fut?' fut':''}" data-tid="es_s">
      <div class="ls-hdr"><span class="tag t-es">ES</span><span class="ls-title">Sesión del día</span><span class="ls-gram">Gram: ${h(es.gram)} · Vocab: ${h(es.vocab)}</span></div>
      <div class="ls-blocks">
        <div class="ls-block"><strong>Anki (5 min)</strong>Revisar todas as cartas ES pendentes.</div>
        <div class="ls-block"><strong>Gramática + Output (20 min)</strong>${h(es.task)}</div>
        <div class="ls-block"><strong>Vocab (5 min)</strong>Tema: ${h(es.vocab)} — aprenda 5 palabras nuevas en frases → adicione ao Anki ES.</div>
      </div>
      <div class="ls-foot">
        <div class="chk">${esDone?'✓':''}</div>
        <span>${esDone?'Sesión completada — ¡excelente!':'Marcar sesión como completada'}</span>
      </div>
    </div>`;
  }

  document.getElementById('content').innerHTML=html;
}

function renderReviews(){
  let pend=0;
  document.getElementById('ritems').innerHTML=REVIEWS.map(r=>{
    const rk=r.id+'_w'+curW;const done=!!S.reviews[rk];
    if(!done)pend++;
    return `<div class="ritem${done?' dr':''}" data-rk="${h(rk)}"><div class="rdot ${done?'rdd':'rdp'}"></div><div class="rt"><div class="rn">${r.name}</div><div class="rw">${r.when}</div></div><button class="rbtn">${done?'Desfazer':'Feita ✓'}</button></div>`;
  }).join('');
  document.getElementById('rcnt').textContent=`${pend} pendente${pend===1?'':'s'}`;
}

function renderMs(){
  const t=today();
  document.getElementById('mslist').innerHTML=MILESTONES.map((m,i)=>{
    const done=!!S.milestones['ms'+i];
    const cur=!done&&t<=m.date&&(i===0||t>MILESTONES[i-1].date);
    const lk=!done&&!cur;
    const lc={en:'var(--en)',fr:'var(--fr)',es:'var(--es)'};
    const dot=`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${lc[m.lang]};margin-right:4px;vertical-align:middle"></span>`;
    return `<div class="msi${done?' done':cur?' cur':' lk'}" data-mi="${i}"><div class="ms-ico">${done?'✅':cur?'🎯':'🔒'}</div><div class="ms-body"><div class="ms-name">${dot}${m.label}</div><div class="ms-desc">${m.desc}</div><div class="ms-date">${fmt(m.date)}</div></div><div class="ms-badge ${done?'mb-d':cur?'mb-c':'mb-l'}">${done?'alcançado':cur?'em progresso':'próximo'}</div></div>`;
  }).join('');
}

function renderAll(){
  renderNav();renderOverview();renderStats();renderWeek();renderGrid();renderDayHdr();renderContent();renderReviews();renderMs();
  document.querySelectorAll('.ltab').forEach(t=>t.classList.toggle('active',t.dataset.l===lang));
}

// ═══════════════════════════════
// EVENTS — event delegation, sem onclick inline
// ═══════════════════════════════
document.getElementById('lang-tabs').addEventListener('click',e=>{
  const t=e.target.closest('.ltab');if(!t)return;
  lang=t.dataset.l;renderAll();
});

document.getElementById('dgrid').addEventListener('click',e=>{
  const b=e.target.closest('.dbtn');if(!b)return;
  selDay=new Date(Number(b.dataset.ts));renderAll();
});

document.getElementById('pw').addEventListener('click',()=>{if(curW>0){curW--;selDay=wStart(curW);renderAll()}});
document.getElementById('nw').addEventListener('click',()=>{if(curW<totalW()-1){curW++;selDay=wStart(curW);renderAll()}});

document.getElementById('content').addEventListener('click',e=>{
  // EN tasks
  const task=e.target.closest('.task:not(.fut)');
  if(task&&task.dataset.tid){
    const k=dkey(selDay);if(!S.tasks[k])S.tasks[k]={};
    S.tasks[k][task.dataset.tid]=!S.tasks[k][task.dataset.tid];
    save();renderAll();return;
  }
  // FR/ES sessions
  const sess=e.target.closest('.lsession:not(.fut)');
  if(sess&&sess.dataset.tid){
    const k=dkey(selDay);if(!S.tasks[k])S.tasks[k]={};
    S.tasks[k][sess.dataset.tid]=!S.tasks[k][sess.dataset.tid];
    save();renderAll();
  }
});

document.getElementById('ritems').addEventListener('click',e=>{
  const item=e.target.closest('.ritem');if(!item)return;
  const rk=item.dataset.rk;if(!rk)return;
  S.reviews[rk]=!S.reviews[rk];save();renderAll();
});

document.getElementById('mslist').addEventListener('click',e=>{
  const m=e.target.closest('.msi:not(.lk)');if(!m)return;
  const i=Number(m.dataset.mi);
  S.milestones['ms'+i]=!S.milestones['ms'+i];save();renderAll();
});

document.getElementById('reset-btn').addEventListener('click',()=>{
  if(confirm('Apagar TODO o progresso? Isso não pode ser desfeito.'))
  {S={tasks:{},reviews:{},milestones:{}};save();renderAll();}
});

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
(async()=>{
  await load();
  if(!S.tasks)S.tasks={};if(!S.reviews)S.reviews={};if(!S.milestones)S.milestones={};
  selDay=new Date(today());curW=wOf(today());
  renderAll();setSave('ok');
})();
</script>
</body>
</html>
